/* Layout: carnet de staff mobile-first — en-tête avec la chaîne de la boucle, une colonne de travail, barre d'onglets en bas sur téléphone. */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --sunk:#E3E9E4; --ink:#13201A; --muted:#56655C; --line:#CFD8D1;
  --pitch:#1D6A46; --pitch-ink:#FFFFFF; --pitch-soft:#DCEBE2; --bib:#E6DA33; --bib-ink:#1E1C05;
  --good:#2B7A4B; --good-soft:#DDEFE3; --warn:#9A6312; --warn-soft:#F6E9CF; --bad:#B03636; --bad-soft:#F6DDDD;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1612; --surface:#15201A; --sunk:#1B2821; --ink:#E5EDE8; --muted:#97A89E; --line:#2B3A31;
  --pitch:#53C08A; --pitch-ink:#07130C; --pitch-soft:#1B3427; --bib:#E2D645; --bib-ink:#1E1C05;
  --good:#63C48F; --good-soft:#1A3326; --warn:#E3AE55; --warn-soft:#3A2D14; --bad:#E58383; --bad-soft:#3D1F1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1612; --surface:#15201A; --sunk:#1B2821; --ink:#E5EDE8; --muted:#97A89E; --line:#2B3A31;
  --pitch:#53C08A; --pitch-ink:#07130C; --pitch-soft:#1B3427; --bib:#E2D645; --bib-ink:#1E1C05;
  --good:#63C48F; --good-soft:#1A3326; --warn:#E3AE55; --warn-soft:#3A2D14; --bad:#E58383; --bad-soft:#3D1F1F; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 96px}
@media (min-width:760px){body{padding-block:0 40px}}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:1.75rem;font-weight:700;line-height:1.05}
h3{font-size:1.25rem;font-weight:600;line-height:1.15}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pitch);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;color:var(--muted)}

/* Header */
header.top{padding-block:18px 10px;display:grid;gap:14px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-size:2.1rem;font-weight:700;line-height:.95;display:flex;align-items:center;gap:10px}
.brand h1 .loopmark{width:30px;height:30px;flex:none}
.brand .tag{font-size:.95rem;color:var(--muted)}
.teamchip{font-family:var(--f-display);font-weight:600;font-size:1rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap}

/* La chaîne */
.chain{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px 8px}
.chain::before{content:"";position:absolute;left:10%;right:10%;top:25px;height:2px;background:var(--line)}
.link{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;cursor:pointer;padding:0 2px;min-width:0}
.link .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-family:var(--f-mono);font-size:.85rem;font-weight:500;position:relative}
.link.on .dot{border-color:var(--pitch);background:var(--pitch-soft)}
.link.here .dot{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch)}
.link .lbl{font-family:var(--f-display);font-weight:600;font-size:.88rem;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.link .sub{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Nav */
nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px}
nav.tabs button{flex:1;border:0;background:none;border-radius:7px;padding:8px 6px;font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.02em;cursor:pointer;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--pitch);color:var(--pitch-ink)}
@media (max-width:759px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:0;border-width:1px 0 0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  nav.tabs button{font-size:.95rem;padding:9px 2px}
}

main{display:grid;gap:18px;padding-block:6px 24px}
.banner{border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;font-size:.95rem}
.banner.ex{background:var(--bib);color:var(--bib-ink)}
.banner.info{background:var(--sunk)}
.banner.err{background:var(--bad-soft);color:var(--ink)}
.banner > div{min-width:0;flex:1 1 260px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.sect{display:grid;gap:12px}
.secthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.secthead > div{min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px;text-align:center}
.btn.primary{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink)}
.btn.bib{background:var(--bib);border-color:var(--bib);color:var(--bib-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}

label.f{display:grid;gap:5px;font-size:.9rem;font-weight:600;min-width:0}
label.f span.hint{font-weight:400;color:var(--muted);font-size:.82rem}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 11px;min-height:42px}
textarea{min-height:170px;resize:vertical;line-height:1.5}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.score{display:flex;align-items:center;gap:8px}
.score input{text-align:center;font-family:var(--f-mono);font-size:1.15rem}
.score span{font-family:var(--f-display);font-weight:700;font-size:1.3rem}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;background:var(--sunk);white-space:nowrap}
.chip.phase{background:var(--pitch-soft);color:var(--ink)}
.chip.plus{background:var(--good-soft);color:var(--good)}
.chip.minus{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.conf-basse{background:var(--sunk);color:var(--muted)}
.chip.conf-moyenne{background:var(--warn-soft);color:var(--warn)}
.chip.conf-haute{background:var(--good-soft);color:var(--good)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 12px;cursor:pointer;font-weight:600;min-height:40px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].v-mieux{background:var(--good);color:var(--surface)}
.seg button[aria-pressed="true"].v-pareil{background:var(--warn);color:var(--surface)}
.seg button[aria-pressed="true"].v-pire{background:var(--bad);color:var(--surface)}
.seg button[aria-pressed="true"].v-na{background:var(--muted);color:var(--surface)}

.obs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.obs.off{opacity:.45}
.obs input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--pitch)}
.obs .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.obs .hyp{font-size:.9rem;color:var(--muted);margin-top:3px}

.list{display:grid;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line > div{min-width:0}

.ev{display:grid;gap:6px;border-left:3px solid var(--line);padding-left:12px}
.ev p{font-size:.92rem}
.ev .src{font-size:.8rem;color:var(--muted)}

.progress{display:flex;gap:6px;align-items:center}
.pip{width:26px;height:10px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.pip.mieux{background:var(--good);border-color:var(--good)}
.pip.pareil{background:var(--warn);border-color:var(--warn)}
.pip.pire{background:var(--bad);border-color:var(--bad)}

.opts{display:grid;gap:12px}
@media (min-width:760px){.opts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start;background:var(--bg);min-width:0}
.opt dl{margin:0;display:grid;gap:6px}
.opt dt{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.75rem;color:var(--muted)}
.opt dd{margin:0;font-size:.92rem}
.opt ul{margin:0;padding-left:18px;font-size:.92rem}
.appr{font-family:var(--f-display);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--pitch)}

.verdict{font-family:var(--f-display);font-weight:700;font-size:1.35rem}
.v-Amélioré{color:var(--good)} .v-Dégradé{color:var(--bad)} .v-Stable{color:var(--warn)} .v-Indéterminé{color:var(--muted)}

.answer{white-space:pre-wrap;font-size:.98rem;line-height:1.55}
.qchips{display:flex;gap:8px;flex-wrap:wrap}
.qchips button{border:1px dashed var(--line);background:none;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.88rem;text-align:left}

.tablewrap{overflow-x:auto}
table.kpi{border-collapse:collapse;width:100%;min-width:520px}
table.kpi th,table.kpi td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.kpi th{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;color:var(--muted)}
table.kpi td.v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.05rem;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--pitch)}

.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big .n{font-family:var(--f-display);font-weight:700;font-size:3.4rem;line-height:.9;color:var(--pitch)}

.timeline{display:grid;gap:0}
.tl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl:last-child{border-bottom:0}
@media (max-width:520px){.tl{grid-template-columns:1fr;gap:4px}}

.empty{display:grid;gap:10px;justify-items:start}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--pitch);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
details > summary{cursor:pointer;font-weight:600;font-size:.92rem;color:var(--muted)}
.ok{color:var(--good);font-weight:600}
</style>
</head>

function saveDraft(){ try{ localStorage.setItem("boucle-draft", JSON.stringify({opponent:S.cap.opponent,shape:S.cap.shape,us:S.cap.us,them:S.cap.them,text:S.cap.text})); }catch(e){} }

/* ---------- utilitaires ---------- */
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => { if(!iso) return ""; const [y,m,d]=iso.slice(0,10).split("-"); return `${d}/${m}`; };
const resultOf = (us,them) => (us===""||them===""||us==null||them==null) ? "" : (Number(us)>Number(them)?"V":Number(us)<Number(them)?"D":"N");
const byId = (arr,id) => arr.find(x=>x.id===id);
const realOnly = arr => { const real = arr.filter(x=>!x.example); return real.length ? real : arr; };
const hasExamples = () => [S.debriefs,S.observations,S.topics,S.decisions].some(a=>a.some(x=>x.example)) || S.team.example;
const pct = (a,b) => b ? Math.round(100*a/b) : null;

function debriefLabel(id){ const d=byId(S.debriefs,id); if(!d) return "match supprimé"; const r=resultOf(d.us,d.them); return `${fmtDate(d.date)} · ${d.opponent||"adversaire"}${d.shape?` (${d.shape})`:""}${r?` · ${d.us}-${d.them}`:""}`; }
function matchesOf(evIds){ const s=new Set(); evIds.forEach(id=>{ const o=byId(S.observations,id); if(o) s.add(o.debriefId); }); return s.size; }
function confidenceOf(n){ return n>=6 ? ["haute","Récurrent"] : n>=3 ? ["moyenne","Tendance"] : ["basse","Hypothèse"]; }

const VSCORE = {mieux:1, pareil:0, pire:-1};
function verdictOf(dec){
  const rv=(dec.reviews||[]).filter(r=>r.verdict && r.verdict!=="na");
  if(!rv.length) return null;
  const m = rv.reduce((a,r)=>a+VSCORE[r.verdict],0)/rv.length;
  return m>0.34 ? "Amélioré" : m<-0.34 ? "Dégradé" : "Stable";
}
function evidenceCount(dec){ return (dec.reviews||[]).filter(r=>r.verdict && r.verdict!=="na" && ((r.example||"").trim() || (r.count||"").toString().trim())).length; }
function biasFlag(dec){
  const rv=(dec.reviews||[]).filter(r=>r.verdict && r.verdict!=="na" && r.result);
  if(rv.length<3) return false;
  const align = rv.every(r=> (r.result==="V"&&r.verdict==="mieux")||(r.result==="D"&&r.verdict==="pire")||(r.result==="N"&&r.verdict==="pareil"));
  const counted = rv.filter(r=>/\d/.test(String(r.count||""))).length;
  return align && counted<2;
}
function reviewsDone(dec){ return (dec.reviews||[]).filter(r=>r.verdict && r.verdict!=="na").length; }

function metrics(){
  const topics=realOnly(S.topics), decs=realOnly(S.decisions);
  const decided=topics.filter(t=>t.status==="decided").length, judged=topics.length;
  const withInt=decs.filter(d=>d.intervention).length, worked=decs.filter(d=>d.workedAt).length;
  const reviewed=decs.filter(d=>reviewsDone(d)>0).length;
  const closedEv=decs.filter(d=>d.status==="closed" && d.evidenceOk).length;
  const month=today().slice(0,7);
  const closedMonth=decs.filter(d=>d.status==="closed" && d.evidenceOk && (d.closedAt||"").slice(0,7)===month).length;
  const active=decs.filter(d=>d.status!=="closed").length;
  return {decided,judged,withInt,worked,reviewed,closedEv,closedMonth,active,ndec:decs.length,ndeb:realOnly(S.debriefs).length};
}

/* ---------- rendu ---------- */
const $ = id => document.getElementById(id);
function render(){
  renderChrome();
  const main=$("main"), a=document.activeElement;
  if(a && main.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type!=="checkbox"){ pending=true; return; }
  pending=false;
  const v = {debrief:vDebrief, sujets:vSujets, decisions:vDecisions, memoire:vMemoire, boucles:vBoucles}[S.view];
  main.innerHTML = banners() + v();
}
function renderChrome(){
  $("teamchip").textContent = S.team.name ? `${S.team.name}${S.team.category?" · "+S.team.category:""}` : "Équipe";
  const m=metrics(), openTopics=realOnly(S.topics).filter(t=>t.status==="open").length;
  const openDec=realOnly(S.decisions).filter(d=>d.status!=="closed");
  const steps=[
    ["Capture", m.ndeb, `${m.ndeb} débrief${m.ndeb>1?"s":""}`, "debrief", m.ndeb>0],
    ["Insight", openTopics, `${openTopics} ouvert${openTopics>1?"s":""}`, "sujets", openTopics>0],
    ["Décision", openDec.length, `${openDec.length} active${openDec.length>1?"s":""}`, "decisions", openDec.length>0],
    ["Intervention", openDec.filter(d=>d.intervention).length, "travaillées", "decisions", openDec.some(d=>d.intervention)],
    ["Revue", m.closedEv, "fermées", "boucles", m.closedEv>0]
  ];
  const here = {debrief:0, sujets:1, decisions:2, memoire:-1, boucles:4}[S.view];
  $("chain").innerHTML = steps.map((s,i)=>`<button class="link ${s[4]?"on":""} ${i===here?"here":""}" data-action="go" data-view="${s[3]}" type="button" aria-label="${s[0]} : ${s[2]}"><span class="dot">${s[1]}</span><span class="lbl">${s[0]}</span><span class="sub">${s[2]}</span></button>`).join("");
  $("tabs").innerHTML = VIEWS.map(([k,l])=>`<button type="button" data-action="go" data-view="${k}" ${S.view===k?'aria-current="page"':""}>${l}</button>`).join("");
}
function banners(){
  let h="";
  if(S.mode==="loading") h+=`<div class="banner info"><div class="thinking"><span class="spin"></span>Ouverture de la mémoire du staff…</div></div>`;
  if(S.mode==="demo") h+=`<div class="banner info"><div><strong>Démonstration.</strong> Saison d'exemple fictive, en lecture seule. L'espace partagé du staff et l'assistant IA s'activent dans la version hébergée.</div></div>`;
  if(S.mode==="live" && !S.canWrite) h+=`<div class="banner info"><div><strong>Lecture seule.</strong> Votre accès permet de consulter, pas d'enregistrer. Demandez un accès Contributeur au propriétaire.</div></div>`;
  if(S.mode==="live" && hasExamples() && S.canWrite) h+=`<div class="banner ex"><div><strong>Saison d'exemple (FC Exemple, données fictives).</strong> Parcourez la boucle, puis effacez l'exemple avant votre premier vrai débrief.</div><button class="btn" data-action="clear-examples" type="button" ${S.set.busy?"disabled":""}>${S.set.busy?"Effacement…":"Effacer l'exemple"}</button></div>`;
  if(S.ai===false && S.mode!=="demo") h+=`<div class="banner info"><div><strong>Assistant IA indisponible ici.</strong> Vous pouvez saisir les observations à la main ; l'extraction, les sujets et les propositions d'entraînement sont désactivés.</div></div>`;
  return h;
}
const thinking = t => `<div class="thinking"><span class="spin"></span>${esc(t)}</div>`;
const phaseChip = p => p ? `<span class="chip phase">${esc(p)}</span>` : "";
const valChip = v => v==="+" ? `<span class="chip plus">+ fonctionne</span>` : `<span class="chip minus">− problème</span>`;

/* ----- Débrief ----- */
function openForReview(){ return realOnly(S.decisions).filter(d=>d.status!=="closed" && d.intervention); }
function vDebrief(){
  const c=S.cap;
  if(c.done){
    return `<section class="card"><p class="eyebrow">Débrief enregistré</p><h2>${c.done.obs} observation${c.done.obs>1?"s":""} ajoutée${c.done.obs>1?"s":""} à la mémoire</h2>
      <p class="muted">${c.done.rev ? `${c.done.rev} décision${c.done.rev>1?"s":""} réévaluée${c.done.rev>1?"s":""}. ` : ""}Prochaine étape : actualiser les sujets pour voir ce qui mérite d'être travaillé.</p>
      <div class="row"><button class="btn primary" data-action="go-sujets-refresh" type="button" ${S.ai===false?"disabled":""}>Actualiser les sujets</button><button class="btn" data-action="new-debrief" type="button">Nouveau débrief</button></div></section>` + recentDebriefs();
  }
  if(c.step==="confirm"){
    const kept=c.extracted.filter(o=>o.keep).length;
    return `<section class="sect"><div class="secthead"><div><p class="eyebrow">Étape 2 sur 2 · ${esc(c.opponent||"Match")} ${c.us!==""&&c.them!==""?esc(c.us+"-"+c.them):""}</p><h2>${c.extracted.length} observation${c.extracted.length>1?"s":""} identifiée${c.extracted.length>1?"s":""}. Confirmer ?</h2></div></div>
      <p class="muted small">Décochez ce qui est faux ou inutile. Touchez + / − pour corriger le sens.</p>
      <div class="list">${c.extracted.map((o,i)=>`<div class="obs ${o.keep?"":"off"}">
        <input type="checkbox" id="keep-${i}" data-action="keep" data-i="${i}" ${o.keep?"checked":""} aria-label="Garder l'observation ${i+1}">
        <div><div class="meta">${phaseChip(o.phase)}<button class="chip ${o.valence==="+"?"plus":"minus"}" style="border:0;cursor:pointer" data-action="flip" data-i="${i}" type="button">${o.valence==="+"?"+ fonctionne":"− problème"}</button>${o.period?`<span class="chip">${esc(o.period)}</span>`:""}${(o.players||[]).map(p=>`<span class="chip">${esc(p)}</span>`).join("")}<span class="chip conf-${esc(o.certainty||"moyenne")}">certitude ${esc(o.certainty||"moyenne")}</span></div>
          <p>${esc(o.text)}</p>${o.principle?`<p class="small muted">Principe : ${esc(o.principle)}</p>`:""}${o.hypothesis?`<p class="hyp">Hypothèse du staff : ${esc(o.hypothesis)}</p>`:""}</div></div>`).join("")}</div>
      ${manualAdd()}
      ${c.error?`<div class="banner err"><div>${esc(c.error)}</div></div>`:""}
      <div class="row"><button class="btn primary" data-action="confirm" type="button" ${c.busy||!S.canWrite?"disabled":""}>${c.busy?"Enregistrement…":`Confirmer ${kept} observation${kept>1?"s":""}`}</button><button class="btn ghost" data-action="back-write" type="button">Revenir au texte</button></div></section>`;
  }
  const rev=openForReview();
  return `<section class="sect"><div class="secthead"><div><p class="eyebrow">Après le match · 3 minutes</p><h2>Débrief</h2></div></div>
    <div class="card"><div class="fgrid">
      <label class="f" for="c-date">Date<input type="date" id="c-date" data-bind="cap.date" value="${esc(c.date)}"></label>
      <label class="f" for="c-opp">Adversaire<input type="text" id="c-opp" data-bind="cap.opponent" value="${esc(c.opponent)}" placeholder="AS Garonne" autocomplete="off"></label>
      <label class="f" for="c-shape">Structure adverse<select id="c-shape" data-bind="cap.shape"><option value="">Non notée</option>${SHAPES.map(s=>`<option ${c.shape===s?"selected":""}>${s}</option>`).join("")}</select></label>
      <div class="f"><span>Score (nous – eux)</span><div class="score"><input type="number" min="0" inputmode="numeric" id="c-us" data-bind="cap.us" value="${esc(c.us)}" aria-label="Buts marqués"><span>–</span><input type="number" min="0" inputmode="numeric" id="c-them" data-bind="cap.them" value="${esc(c.them)}" aria-label="Buts encaissés"></div></div>
    </div></div>
    ${rev.length?`<div class="card"><div><p class="eyebrow">Revue ciblée</p><h3>Ce que nous travaillons en ce moment</h3><p class="small muted">Deux réponses rapides par décision. Un exemple ou un comptage rend le verdict solide.</p></div>
      ${rev.map(d=>{ const r=c.reviews[d.id]||{}; return `<div class="sect" style="gap:8px;padding-top:10px;border-top:1px solid var(--line)"><p><strong>${esc(d.title)}</strong></p><p class="small muted">Indicateur : ${esc(d.kpi||"—")}</p>
        <div class="seg" role="group" aria-label="Évolution">${[["mieux","Mieux"],["pareil","Pareil"],["pire","Pire"],["na","Pas observé"]].map(([k,l])=>`<button type="button" class="v-${k}" aria-pressed="${r.verdict===k}" data-action="rv" data-id="${d.id}" data-v="${k}">${l}</button>`).join("")}</div>
        <div class="fgrid"><label class="f" for="rx-${d.id}">Un exemple<input type="text" id="rx-${d.id}" data-bind="rev.${d.id}.example" value="${esc(r.example||"")}" placeholder="Ce qu'on a vu"></label><label class="f" for="rc-${d.id}">Comptage<span class="hint">facultatif, ex. 6/9</span><input type="text" id="rc-${d.id}" data-bind="rev.${d.id}.count" value="${esc(r.count||"")}" inputmode="text"></label></div></div>`; }).join("")}</div>`:""}
    <div class="card"><label class="f" for="c-text">Ce que vous avez vu<span class="hint">Parlez comme au vestiaire. Sur téléphone, touchez le micro du clavier pour dicter.</span>
      <textarea id="c-text" data-bind="cap.text" placeholder="Première mi-temps, on a souffert quand leur 6 venait décrocher. Nos deux attaquants pressaient trop haut et le milieu sortait trop tard. Par contre la sortie côté droit a bien fonctionné…">${esc(c.text)}</textarea></label>
      ${c.error?`<div class="banner err"><div>${esc(c.error)}</div></div>`:""}
      <div class="row">${c.busy?thinking("Claude structure votre débrief… (5 à 30 s)"):`<button class="btn primary" data-action="extract" type="button" ${S.ai===false||!S.canWrite?"disabled":""}>Extraire les observations</button><button class="btn ghost" data-action="manual" type="button" ${!S.canWrite?"disabled":""}>Saisir à la main</button>`}</div>
    </div></section>` + recentDebriefs();
}
function manualAdd(){
  return `<details><summary>Ajouter une observation à la main</summary><div class="fgrid" style="margin-top:10px">
    <label class="f" for="m-phase">Phase<select id="m-phase">${PHASES.map(p=>`<option>${p}</option>`).join("")}</select></label>
    <label class="f" for="m-val">Sens<select id="m-val"><option value="-">− problème</option><option value="+">+ fonctionne</option></select></label>
    <label class="f" for="m-text" style="grid-column:1/-1">Observation<input type="text" id="m-text" placeholder="Nos centraux jouent long dès la pression"></label></div>
    <div class="row" style="margin-top:10px"><button class="btn" data-action="manual-add" type="button">Ajouter</button></div></details>`;
}
function recentDebriefs(){
  const ds=[...S.debriefs].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,6);
  if(!ds.length) return S.mode==="live"?`<section class="card flat empty"><h3>Aucun débrief pour l'instant</h3><p class="muted">Après votre prochain match, dictez trois minutes de ce que vous avez vu. Boucle en tire les observations.</p></section>`:"";
  return `<section class="card"><p class="eyebrow">Derniers débriefs</p><div>${ds.map(d=>{ const n=S.observations.filter(o=>o.debriefId===d.id).length; const r=resultOf(d.us,d.them); return `<div class="line"><div><strong>${esc(d.opponent||"Match")}</strong> <span class="muted small">${fmtDate(d.date)}${d.shape?" · "+esc(d.shape):""}</span>${d.example?` <span class="chip">exemple</span>`:""}</div><div class="num">${r?`${esc(d.us)}-${esc(d.them)} <span class="chip ${r==="V"?"plus":r==="D"?"minus":""}">${r}</span>`:""} <span class="muted small">${n} obs.</span></div></div>`; }).join("")}</div></section>`;
}

/* ----- Sujets ----- */
function vSujets(){
  const sj=S.sujets, open=S.topics.filter(t=>t.status==="open"), done=S.topics.filter(t=>t.status!=="open");
  const nObs=realOnly(S.observations).length;
  return `<section class="sect"><div class="secthead"><div><p class="eyebrow">Insight</p><h2>Ce qui mérite peut-être d'être travaillé</h2></div>
      <button class="btn primary" data-action="refresh-topics" type="button" ${sj.busy||S.ai===false||!S.canWrite||!nObs?"disabled":""}>${sj.busy?"Analyse…":"Actualiser les sujets"}</button></div>
    <p class="muted small">Trois sujets au maximum, tirés de vos observations confirmées. La confiance dépend du nombre de matchs où le sujet revient : 1 à 2 matchs = hypothèse, 3 à 5 = tendance, 6 et plus = récurrent.</p>
    ${sj.busy?`<div class="card">${thinking("Claude relit vos dernières observations…")}</div>`:""}
    ${sj.error?`<div class="banner err"><div>${esc(sj.error)}</div></div>`:""}
    ${!open.length && !sj.busy ? `<div class="card flat empty"><h3>Aucun sujet ouvert</h3><p class="muted">${nObs?"Actualisez les sujets après chaque débrief.":"Faites d'abord un débrief : les sujets naissent de vos observations."}</p></div>`:""}
    ${open.map(topicCard).join("")}
    ${done.length?`<div class="card"><p class="eyebrow">Déjà traités</p>${done.map(t=>`<div class="line"><div>${esc(t.title)} ${t.example?`<span class="chip">exemple</span>`:""}</div><div class="small muted">${t.status==="decided"?"→ décision":"écarté"}</div></div>`).join("")}</div>`:""}
  </section>`;
}
function topicCard(t){
  const n=matchesOf(t.evidenceIds||[]), [cl,cn]=confidenceOf(n), deciding=S.sujets.decideFor===t.id, f=S.sujets.form;
  const ev=(t.evidenceIds||[]).map(id=>byId(S.observations,id)).filter(Boolean);
  return `<article class="card"><div class="chips">${phaseChip(t.phase)}${valChip(t.valence)}<span class="chip conf-${cl}">${cn} · ${n} match${n>1?"s":""}</span>${t.example?`<span class="chip">exemple</span>`:""}</div>
    <h3>${esc(t.title)}</h3><p>${esc(t.summary)}</p>
    <details><summary>Voir les ${ev.length} observation${ev.length>1?"s":""} à l'appui</summary><div class="ev" style="margin-top:10px">${ev.map(o=>`<div><p>${o.valence==="+"?"＋":"−"} ${esc(o.text)}</p><p class="src">${esc(debriefLabel(o.debriefId))}</p></div>`).join("")}</div></details>
    ${deciding?`<div class="sect" style="border-top:1px solid var(--line);padding-top:12px">
      <label class="f" for="d-title">Que voulons-nous changer ?<input type="text" id="d-title" data-bind="sujets.form.title" value="${esc(f.title)}"></label>
      <div class="fgrid"><label class="f" for="d-kpi">Indicateur à suivre<span class="hint">comptable par un adjoint pendant le match</span><input type="text" id="d-kpi" data-bind="sujets.form.kpi" value="${esc(f.kpi)}"></label>
      <label class="f" for="d-after">Revue après<select id="d-after" data-bind="sujets.form.after">${[2,3,4,5].map(x=>`<option value="${x}" ${Number(f.after)===x?"selected":""}>${x} matchs</option>`).join("")}</select></label></div>
      <div class="row"><button class="btn primary" data-action="create-decision" data-id="${t.id}" type="button" ${!S.canWrite?"disabled":""}>Créer la décision</button><button class="btn ghost" data-action="cancel-decide" type="button">Annuler</button></div></div>`
    :`<div class="row"><button class="btn primary" data-action="decide" data-id="${t.id}" type="button" ${!S.canWrite?"disabled":""}>Décider</button><button class="btn ghost" data-action="dismiss" data-id="${t.id}" type="button" ${!S.canWrite?"disabled":""}>Écarter</button></div>`}
  </article>`;
}

/* ----- Décisions ----- */
function vDecisions(){
  const all=[...S.decisions].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  const open=all.filter(d=>d.status!=="closed"), closed=all.filter(d=>d.status==="closed");
  return `<section class="sect"><div><p class="eyebrow">Décision → intervention → revue</p><h2>Décisions actives</h2></div>
    ${!open.length?`<div class="card flat empty"><h3>Aucune décision active</h3><p class="muted">Transformez un sujet en décision depuis l'onglet Sujets.</p><button class="btn" data-action="go" data-view="sujets" type="button">Voir les sujets</button></div>`:""}
    ${open.map(decCard).join("")}
    ${closed.length?`<div class="sect"><h3>Boucles fermées</h3>${closed.map(d=>`<div class="card"><div class="chips">${phaseChip(d.phase)}${d.example?`<span class="chip">exemple</span>`:""}${d.evidenceOk?`<span class="chip plus">avec preuves</span>`:`<span class="chip warn">sans preuve suffisante</span>`}</div><div class="row" style="justify-content:space-between"><h3 class="grow" style="min-width:0">${esc(d.title)}</h3><span class="verdict v-${esc(d.outcome)}">${esc(d.outcome)}</span></div><p class="small muted">${esc(d.kpi)} · fermée le ${fmtDate(d.closedAt)} · ${reviewsDone(d)} revue${reviewsDone(d)>1?"s":""}</p></div>`).join("")}</div>`:""}
  </section>`;
}
function decCard(d){
  const st=S.dec, busy=st.busy[d.id], err=st.error[d.id], done=reviewsDone(d), need=d.reviewAfter||3;
  const pips=Array.from({length:Math.max(need,done)},(_,i)=>{ const r=(d.reviews||[]).filter(x=>x.verdict&&x.verdict!=="na")[i]; return `<span class="pip ${r?r.verdict:""}" title="${r?esc(r.verdict+" · "+fmtDate(r.date)):"à venir"}"></span>`; }).join("");
  const verdict=verdictOf(d), ev=evidenceCount(d), ready=done>=need;
  let inter="";
  if(d.intervention){
    const i=d.intervention;
    inter=`<div class="sect" style="gap:8px;border-top:1px solid var(--line);padding-top:12px"><p class="appr">Intervention · ${esc(APPROACH[i.approach]||i.approach)}${i.fromGraph===false?" · hors référentiel":""}</p><h3>${esc(i.title)}</h3><p class="small">${esc(i.setup)}</p><p class="small"><strong>Contrainte :</strong> ${esc(i.constraint)}</p><p class="small"><strong>Réussite :</strong> ${esc(i.success)}</p>
      <div class="row">${d.workedAt?`<span class="ok small">Travaillée le ${fmtDate(d.workedAt)}</span>`:`<button class="btn" data-action="worked" data-id="${d.id}" type="button" ${!S.canWrite?"disabled":""}>Travaillée à l'entraînement</button>`}<button class="btn ghost" data-action="reopen-options" data-id="${d.id}" type="button" ${!S.canWrite?"disabled":""}>Changer d'approche</button></div></div>`;
  } else if(d.options && d.options.length && st.open[d.id]!==false){

      <div class="row"><button class="btn ghost" data-action="turn" data-id="${d.id}" type="button" ${busy||S.ai===false?"disabled":""}>Proposer trois autres</button></div></div>`;
  } else {
    inter=`<div class="row" style="border-top:1px solid var(--line);padding-top:12px">${busy?thinking("Claude part du référentiel staff… (10 à 40 s)"):`<button class="btn primary" data-action="turn" data-id="${d.id}" type="button" ${S.ai===false||!S.canWrite?"disabled":""}>Transformer en entraînement</button>`}</div>`;

    ${err?`<div class="banner err"><div>${esc(err)}</div></div>`:""}

    ${ready?`<div class="sect" style="gap:8px;border-top:1px solid var(--line);padding-top:12px"><p class="eyebrow">Verdict sur ${done} matchs</p><p class="verdict v-${verdict}">${verdict}</p>

      <p class="small muted">${ev>=2?`${ev} revues appuyées par un exemple ou un comptage : la boucle peut se fermer avec preuves.`:`Seulement ${ev} revue${ev>1?"s":""} appuyée${ev>1?"s":""} par un exemple ou un comptage. Il en faut 2 pour une boucle fermée avec preuves.`}</p>

    :`<p class="small muted">${d.intervention?`Encore ${need-done} match${need-done>1?"s":""} de revue ciblée avant un verdict.`:"Choisissez une intervention : la revue ciblée apparaîtra dans le prochain débrief."}</p>`}
  </article>`;
}

/* ---------- interactions ---------- */
function setPath(path,val){
  const p=path.split(".");
  if(p[0]==="rev"){ const r=S.cap.reviews[p[1]]||(S.cap.reviews[p[1]]={}); r[p[2]]=val; return; }
  let o=S; for(let i=0;i<p.length-1;i++) o=o[p[i]]; o[p[p.length-1]]=val;
}
document.addEventListener("input", e=>{
  const b=e.target.dataset && e.target.dataset.bind; if(!b) return;
  setPath(b, e.target.value);
  if(b.startsWith("cap.")) saveDraft();
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset && t.dataset.bind){ setPath(t.dataset.bind,t.value); if(t.dataset.live){ t.blur(); render(); } }
  if(t.dataset && t.dataset.action==="keep"){ S.cap.extracted[Number(t.dataset.i)].keep=t.checked; render(); }
});
document.addEventListener("focusout", ()=>{ setTimeout(()=>{ if(pending){ const a=document.activeElement; if(!(a && $("main").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render(); } },0); });

document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-action]"); if(!el || el.dataset.action==="keep") return;
  const ae=document.activeElement; if(ae && ae!==el && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) ae.blur();
  const a=el.dataset.action, id=el.dataset.id;
  try{
    if(a==="go"){ S.view=el.dataset.view; try{localStorage.setItem("boucle-view",S.view);}catch(_){} render(); window.scrollTo({top:0}); return; }
    if(a==="rv"){ const r=S.cap.reviews[id]||(S.cap.reviews[id]={}); r.verdict = r.verdict===el.dataset.v ? "" : el.dataset.v; render(); return; }
    if(a==="extract") return await extract();
    if(a==="manual"){ S.cap.step="confirm"; S.cap.extracted=[]; S.cap.error=""; render(); return; }
    if(a==="manual-add"){ const txt=$("m-text").value.trim(); if(!txt) return; S.cap.extracted.push({phase:$("m-phase").value, valence:$("m-val").value, text:txt, principle:"", players:[], period:"", hypothesis:"", certainty:"moyenne", keep:true}); render(); return; }
    if(a==="flip"){ const o=S.cap.extracted[Number(el.dataset.i)]; o.valence=o.valence==="+"?"-":"+"; render(); return; }
    if(a==="back-write"){ S.cap.step="write"; render(); return; }
    if(a==="confirm") return await confirmDebrief();
    if(a==="new-debrief"){ S.cap.done=null; S.cap.step="write"; render(); return; }
    if(a==="go-sujets-refresh"){ S.cap.done=null; S.cap.step="write"; S.view="sujets"; render(); return await refreshTopics(); }
    if(a==="refresh-topics") return await refreshTopics();
    if(a==="decide"){ const t=byId(S.topics,id); S.sujets.decideFor=id; S.sujets.form={title:t.title, kpi:t.kpi||"", after:3}; render(); return; }
    if(a==="cancel-decide"){ S.sujets.decideFor=null; render(); return; }
    if(a==="create-decision") return await createDecision(id);
    if(a==="dismiss") return await db.doc("topics/"+id).update({status:"dismissed"});
    if(a==="turn") return await turnIntoTraining(id);
    if(a==="choose"){ const d=byId(S.decisions,id); const o=d.options[Number(el.dataset.k)]; return await db.doc("decisions/"+id).update({intervention:o}); }
    if(a==="reopen-options"){ S.dec.open[id]=true; return await db.doc("decisions/"+id).update({intervention:null}); }
    if(a==="worked") return await db.doc("decisions/"+id).update({workedAt:today()});
    if(a==="extend"){ const d=byId(S.decisions,id); return await db.doc("decisions/"+id).update({reviewAfter:(d.reviewAfter||3)+2}); }
    if(a==="close"){ const d=byId(S.decisions,id); return await db.doc("decisions/"+id).update({status:"closed", outcome:verdictOf(d)||"Indéterminé", evidenceOk:evidenceCount(d)>=2, closedAt:new Date().toISOString()}); }
    if(a==="q"){ S.mem.q=el.closest(".qchips").querySelectorAll("button")[Number(el.dataset.i)].textContent; render(); return await ask(); }
    if(a==="ask") return await ask();
    if(a==="stop"){ memCtl && memCtl.abort(); return; }
    if(a==="save-team"){ await db.doc("meta/team").set({name:S.team.name.trim(), level:S.team.level, category:S.team.category.trim(), updatedAt:new Date().toISOString()}); S.set.msg="Enregistré"; render(); setTimeout(()=>{S.set.msg="";render();},2000); return; }
    if(a==="clear-examples") return await clearExamples();
  }catch(err){ dbFail(err); }
});
function dbFail(err){
  const code=err && err.code;
  if(code==="invalid_argument"){ S.canWrite=false; }
  const msg = code==="quota_exceeded" ? "La mémoire est pleine : supprimez d'anciens éléments avant d'en ajouter." : code==="invalid_argument" ? "Votre accès ne permet pas d'enregistrer." : "L'enregistrement a échoué. Réessayez dans un instant.";
  S.cap.error=msg; S.cap.busy=false; render();
}

/* ---------- appels à Claude ---------- */
function aiError(e){
  const c=e && e.code;
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed"){ S.ai=false; return "Claude n'est pas autorisé dans cette vue."; }
  if(c==="rate_limited") return "Trop de demandes pour le moment. Réessayez dans quelques minutes.";
  if(c==="invalid_json"||c==="empty_completion") return "La réponse n'était pas exploitable. Réessayez.";
  if(c==="refused") return "Claude n'a pas traité ce texte. Reformulez-le.";
  if(c==="cancelled") return "";
  return "La demande a échoué. Réessayez.";
}
const teamLine = () => `${S.team.level==="academie"?"académie":S.team.level==="amateur"?"amateur":"semi-pro"}${S.team.category?", "+S.team.category:""}`;

async function extract(){
  const c=S.cap; if(!c.text.trim()){ c.error="Dictez ou écrivez au moins quelques phrases."; render(); return; }
  c.busy=true; c.error=""; render();
  const prompt=`Tu assistes le staff d'une équipe de football (${teamLine()}). Transforme le débrief d'après-match ci-dessous en observations footballistiques structurées.
Règles :
- Une observation = un fait de jeu observé. Découpe quand le coach décrit plusieurs faits.
- N'invente rien qui n'est pas dans le texte. Joueurs : seulement ceux nommés tels quels (prénom, numéro ou poste).
- phase : une valeur exacte parmi ${JSON.stringify(PHASES)}.
- principle : le principe de jeu concerné, 3 à 7 mots.
- valence : "+" si ça a fonctionné, "-" si c'est un problème.
- period : "1re MT", "2e MT", "minute X", ou "" si rien n'est dit.
- hypothesis : la cause avancée par le coach, sinon "".
- certainty : "haute" si le coach est affirmatif, "moyenne" par défaut, "basse" s'il doute.
- text : reformulation fidèle, 25 mots maximum, à la première personne du pluriel ("Nous…", "Nos…").
Contexte : adversaire ${c.opponent||"non précisé"}, structure adverse ${c.shape||"non notée"}, score ${c.us!==""&&c.them!==""?c.us+"-"+c.them:"non noté"}.
Réponds uniquement en JSON : {"observations":[{"phase":"","principle":"","players":[],"period":"","valence":"-","text":"","hypothesis":"","certainty":"moyenne"}]}
Débrief :
"""${c.text.slice(0,12000)}"""`;
  try{
    const out=await sample.json(prompt,{modelTier:"default"});
    const list=(out && Array.isArray(out.observations) ? out.observations : []).filter(o=>o && o.text).slice(0,20).map(o=>({
      phase:PHASES.includes(o.phase)?o.phase:"Gestion du match", principle:String(o.principle||""), players:Array.isArray(o.players)?o.players.map(String).slice(0,6):[],
      period:String(o.period||""), valence:o.valence==="+"?"+":"-", text:String(o.text), hypothesis:String(o.hypothesis||""),
      certainty:["haute","moyenne","basse"].includes(o.certainty)?o.certainty:"moyenne", keep:true}));
    if(!list.length){ c.error="Aucune observation trouvée. Ajoutez des faits de jeu précis."; }
    else { c.extracted=list; c.step="confirm"; }
  }catch(e){ c.error=aiError(e); }
  c.busy=false; render();
}

async function confirmDebrief(){
  const c=S.cap, keep=c.extracted.filter(o=>o.keep);
  const revs=Object.entries(c.reviews).filter(([id,r])=>r.verdict && byId(S.decisions,id));
  if(!keep.length && !revs.length){ c.error="Gardez au moins une observation."; render(); return; }
  c.busy=true; c.error=""; render();
  const now=new Date().toISOString(), us=c.us===""?"":Number(c.us), them=c.them===""?"":Number(c.them);
  const dref=db.collection("debriefs").doc();
  await dref.set({date:c.date, opponent:c.opponent.trim(), shape:c.shape, us, them, text:c.text, author:uid||"", createdAt:now});
  for(const o of keep){ const {keep:_k, ...body}=o; await db.collection("observations").doc().set({...body, debriefId:dref.id, createdAt:now, author:uid||""}); }
  for(const [id,r] of revs){
    const d=byId(S.decisions,id);
    const reviews=[...(d.reviews||[]), {debriefId:dref.id, date:c.date, opponent:c.opponent.trim(), result:resultOf(us,them), verdict:r.verdict, example:(r.example||"").trim(), count:(r.count||"").trim()}];
    await db.doc("decisions/"+id).update({reviews});
  }
  c.done={obs:keep.length, rev:revs.length};
  Object.assign(c,{busy:false, step:"write", text:"", opponent:"", shape:"", us:"", them:"", reviews:{}, extracted:[], date:today()});
  saveDraft(); render();
}

async function refreshTopics(){
  const sj=S.sujets; if(sj.busy) return;
  const obs=realOnly(S.observations);
  if(!obs.length){ sj.error="Aucune observation à analyser."; render(); return; }
  sj.busy=true; sj.error=""; render();
  const recentDeb=[...realOnly(S.debriefs)].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,8).map(d=>d.id);
  const pool=obs.filter(o=>recentDeb.includes(o.debriefId)).slice(0,160);
  const lines=pool.map(o=>`${o.id} | ${debriefLabel(o.debriefId)} | ${o.phase} | ${o.valence} | ${o.text}${o.hypothesis?" | hypothèse : "+o.hypothesis:""}`).join("\n");
  const taken=S.topics.filter(t=>t.status!=="open").map(t=>"- "+t.title).join("\n")||"aucun";
  const prompt=`Tu assistes le staff d'une équipe de football (${teamLine()}). À partir des observations ci-dessous, propose au maximum 3 sujets qui méritent peut-être d'être travaillés.
Priorités : un sujet qui revient sur plusieurs matchs passe avant un fait isolé ; l'impact sur les buts ou occasions compte ; un point positif peut être un sujet "à consolider".
Règles :
- evidenceIds : uniquement des identifiants présents dans la liste, au moins 2 si possible.
- N'invente aucun fait. Ne reprends pas un sujet déjà traité.
- title : 8 mots maximum. summary : 35 mots maximum, factuel.
- phase : une valeur exacte parmi ${JSON.stringify(PHASES)}. valence : "-" ou "+".
- kpi : un indicateur simple qu'un adjoint peut compter pendant un match (forme "X / Y").
Sujets déjà traités :
${taken}
Observations (id | match | phase | sens | texte) :
${lines}
Réponds uniquement en JSON : {"topics":[{"title":"","summary":"","phase":"","valence":"-","evidenceIds":[],"kpi":""}]}`;
  try{
    const out=await sample.json(prompt,{modelTier:"default"});
    const ids=new Set(pool.map(o=>o.id));
    const fresh=(out && Array.isArray(out.topics)?out.topics:[]).map(t=>({title:String(t.title||"").slice(0,90), summary:String(t.summary||""), phase:PHASES.includes(t.phase)?t.phase:"", valence:t.valence==="+"?"+":"-", evidenceIds:(Array.isArray(t.evidenceIds)?t.evidenceIds:[]).map(String).filter(x=>ids.has(x)), kpi:String(t.kpi||"")})).filter(t=>t.title && t.evidenceIds.length).slice(0,3);
    if(!fresh.length){ sj.error="Pas de sujet solide dans les observations actuelles."; }
    else{
      for(const t of S.topics.filter(t=>t.status==="open" && !t.example)) await db.doc("topics/"+t.id).delete();
      const now=new Date().toISOString();
      for(const t of fresh) await db.collection("topics").doc().set({...t, status:"open", createdAt:now});
    }
  }catch(e){ sj.error = aiError(e); }
  sj.busy=false; render();
}

async function createDecision(topicId){
  const t=byId(S.topics,topicId), f=S.sujets.form;
  if(!f.title.trim()){ return; }
  const ref=db.collection("decisions").doc();
  await ref.set({title:f.title.trim(), problem:t.summary||"", topicId, phase:t.phase||"", evidenceIds:t.evidenceIds||[], kpi:f.kpi.trim(), reviewAfter:Number(f.after)||3, status:"open", intervention:null, reviews:[], createdAt:new Date().toISOString(), author:uid||""});
  await db.doc("topics/"+topicId).update({status:"decided", decisionId:ref.id});
  S.sujets.decideFor=null; S.view="decisions"; render();
}

async function turnIntoTraining(id){
  const st=S.dec, d=byId(S.decisions,id); if(st.busy[id]) return;
  st.busy[id]=true; st.error[id]=""; st.open[id]=true; render();
  const ev=(d.evidenceIds||[]).map(x=>byId(S.observations,x)).filter(Boolean).map(o=>`- ${o.text}${o.hypothesis?" (hypothèse : "+o.hypothesis+")":""}`).join("\n");
  const graph=GRAPH[d.phase];
  const prompt=`Tu es entraîneur adjoint diplômé. Le staff d'une équipe (${teamLine()}) a pris cette décision :
Décision : ${d.title}
Problème : ${d.problem}
Indicateur suivi : ${d.kpi}
Observations de match :
${ev||"- aucune"}
${graph?`Référentiel du staff (à utiliser en priorité, sans le contredire) :
${graph}`:"Aucun référentiel staff pour cette phase : tes propositions sont hors référentiel, mets fromGraph à false."}
Propose exactement 3 façons de travailler ce comportement à l'entraînement, dans cet ordre :
1. approach "decouverte" : un environnement où les joueurs trouvent la solution eux-mêmes.
2. approach "repetition" : un environnement plus contraint qui répète le comportement.
3. approach "realisme" : reproduire presque exactement la structure du problème rencontré en match.
Pour chacune : title (6 mots max), why (pourquoi cet environnement, 25 mots max), expected (comportement attendu), constraint (la contrainte qui provoque le comportement), setup (espace en mètres, effectif, durée en minutes ; pour 14 à 18 joueurs de champ, séance de 75 à 90 min), cues (3 consignes courtes de 5 mots max), success (critère observable chiffré), tradeoff (le risque ou effet secondaire), fromGraph (true si tiré du référentiel).
Français, vocabulaire de terrain, aucune généralité.
Réponds uniquement en JSON : {"options":[{"approach":"decouverte","title":"","why":"","expected":"","constraint":"","setup":"","cues":["","",""],"success":"","tradeoff":"","fromGraph":true}]}`;
  try{
    const out=await sample.json(prompt,{modelTier:"default", cache:false});
    const opts=(out && Array.isArray(out.options)?out.options:[]).slice(0,3).map(o=>({approach:["decouverte","repetition","realisme"].includes(o.approach)?o.approach:"realisme", title:String(o.title||""), why:String(o.why||""), expected:String(o.expected||""), constraint:String(o.constraint||""), setup:String(o.setup||""), cues:(Array.isArray(o.cues)?o.cues:[]).map(String).slice(0,4), success:String(o.success||""), tradeoff:String(o.tradeoff||""), fromGraph: graph ? o.fromGraph!==false : false}));
    if(opts.length<3) st.error[id]="Proposition incomplète. Réessayez.";
    else await db.doc("decisions/"+id).update({options:opts});
  }catch(e){ st.error[id]= aiError(e); }
  st.busy[id]=false; render();
}

let memCtl=null;
async function ask(){
  const m=S.mem; if(!m.q.trim()||m.busy) return;
  m.busy=true; m.answer=""; m.error=""; render();
  const debs=realOnly(S.debriefs), obs=realOnly(S.observations), decs=realOnly(S.decisions);
  const dLines=[...debs].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(d=>{
    const os=obs.filter(o=>o.debriefId===d.id).map(o=>`    [${o.phase} ${o.valence}] ${o.text}${o.hypothesis?" (hyp. "+o.hypothesis+")":""}`).join("\n");
    return `- ${debriefLabel(d.id)}\n${os}`; }).join("\n");
  const kLines=decs.map(k=>`- Décision « ${k.title} » (${k.phase}), indicateur : ${k.kpi}. Intervention : ${k.intervention?`${APPROACH[k.intervention.approach]||""} — ${k.intervention.title}`:"aucune"}${k.workedAt?", travaillée le "+k.workedAt:""}. Revues : ${(k.reviews||[]).map(r=>`${r.date} ${r.opponent} ${r.verdict}${r.count?" ("+r.count+")":""}${r.example?" « "+r.example+" »":""}`).join(" ; ")||"aucune"}. Statut : ${k.status==="closed"?"fermée, "+k.outcome:"en cours"}.`).join("\n");
  const prompt=`Tu es la mémoire du staff d'une équipe de football (${teamLine()}). Réponds à la question uniquement avec les données ci-dessous.
Règles : français, 180 mots maximum ; cite les matchs par date et adversaire ; distingue ce qui a été essayé, ce qui a semblé fonctionner et ce qui reste incertain ; une évolution observée est une association, pas une preuve de cause ; si les données ne suffisent pas, dis-le et indique ce qu'il faudrait noter aux prochains débriefs. Pas de titres Markdown, pas de gras.
Question : ${m.q}
Matchs et observations :
${dLines||"aucun"}
Décisions et revues :
${kLines||"aucune"}`;
  memCtl=new AbortController();
  try{
    await sample(prompt.slice(0,200000),{signal:memCtl.signal, cache:false, onText:({text})=>{ m.answer=text; const el=$("answer"); if(el) el.textContent=text; else render(); }});
  }catch(e){ if(e && e.text) m.answer=e.text; m.error=aiError(e); }
  m.busy=false; render();
}

async function clearExamples(){
  if(S.set.busy) return; S.set.busy=true; render();
  try{
    for(const [coll,key] of [["observations","observations"],["debriefs","debriefs"],["topics","topics"],["decisions","decisions"]]){
      for(const x of S[key].filter(x=>x.example)) await db.doc(coll+"/"+x.id).delete();
    }
    if(S.team.example) await db.doc("meta/team").set({name:"", level:"semi-pro", category:"", updatedAt:new Date().toISOString()});
  }catch(e){ dbFail(e); }
  S.set.busy=false; S.view="debrief"; render();
}

/* ---------- démarrage ---------- */
function loadExampleLocal(){
  S.team={...EXAMPLE.team}; S.debriefs=EXAMPLE.debriefs; S.observations=EXAMPLE.observations; S.topics=EXAMPLE.topics; S.decisions=EXAMPLE.decisions;
}
const use = n => (window.claude && typeof window.claude.use==="function") ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
render();
(async()=>{
  const [d, s, u] = await Promise.all([use("db"), use("sample"), use("user")]);
  sample=s; S.ai = s ? null : false;
  if(!d){ S.mode="demo"; S.canWrite=false; loadExampleLocal(); render(); return; }
  db=d;
  if(u){ try{ uid=await u.id(); }catch(_){} try{ const w=await u.can("data.write"); S.canWrite = w!==false; }catch(_){ S.canWrite=true; } } else S.canWrite=true;
  const got=new Set();
  const mark=k=>{ got.add(k); if(got.size>=5) S.mode="live"; render(); };
  const sort=(arr,f)=>arr.sort((a,b)=>String(a[f]||"").localeCompare(String(b[f]||"")));
  const onErr=e=>{ if(e && e.code==="revoked"){ S.canWrite=false; } render(); };
  db.doc("meta/team").onSnapshot(sn=>{ S.team = sn.exists ? {name:"",level:"semi-pro",category:"", ...sn.data()} : {name:"",level:"semi-pro",category:""}; mark("team"); }, onErr);
  db.collection("debriefs").onSnapshot(sn=>{ S.debriefs=sort(sn.docs.map(x=>({id:x.id,...x.data()})),"date"); mark("debriefs"); }, onErr);
  db.collection("observations").onSnapshot(sn=>{ S.observations=sn.docs.map(x=>({id:x.id,...x.data()})); mark("observations"); }, onErr);
  db.collection("topics").onSnapshot(sn=>{ S.topics=sort(sn.docs.map(x=>({id:x.id,...x.data()})),"createdAt").reverse(); mark("topics"); }, onErr);
  db.collection("decisions").onSnapshot(sn=>{ S.decisions=sn.docs.map(x=>({id:x.id,...x.data()})); mark("decisions"); }, onErr);
})();
</script>
